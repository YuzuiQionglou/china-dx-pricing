  mark.ph { background: var(--ph-bg); color: var(--ph-ink); padding: 0 4px; border-radius: 3px; font-family: ui-monospace, Menlo, monospace; font-size: .88em; border: 1px dashed #c9a400; }

  .formula { font-size: 14px; color: var(--ink-2); margin: 0; }

  #chartImg { display: none; width: 100%; height: auto; }
  .notes { list-style: none; padding: 0; margin: 14px 0 0; display: grid; gap: 8px; font-size: 15px; }

  .live.down { color: var(--inf); }
  .caption { font-size: 14px; color: var(--ink-2); margin: 12px 0 0; }

  /* Workflow */
  .flow { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; grid-template-columns: 1fr; }
  .step { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .step.is-verify { border: 1.5px dashed var(--ver); background: #fbfbfa; }

  .arrow { text-align: center; color: var(--ink-2); font-size: 20px; line-height: 1; padding: 6px 0; }
  .arrow::before { content: "↓"; }
  @media (min-width: 900px) {
    .flow { grid-template-columns: 1fr auto 1fr auto 1fr auto 1.6fr auto 1fr; align-items: stretch; }
    .arrow { display: flex; align-items: center; padding: 0 4px; }

  .flow-note { margin: 14px 0 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-size: 15px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .flow-note p { margin: 0; flex: 1 1 260px; }

  /* Lists */
  .qlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .qlist li { background: var(--surface); border: 1px dashed var(--ver); border-radius: 8px; padding: 10px 14px; display: flex; gap: 10px; align-items: baseline; }
  .qlist li .q { font-weight: 700; color: var(--ver); }

  .prose p { margin: 0 0 10px; }
  footer.site { margin-top: 40px; border-top: 1px solid var(--line); background: var(--surface); }
  footer.site p { font-size: 13.5px; color: var(--ink-2); margin: 0; padding: 20px 0 32px; }

  /* Print: every section, one after the other — a clean 1–2 page brief */
  @media print {

    h1 { font-size: 20pt; }
    h2 { font-size: 13.5pt; }
    main .panel { padding: 10pt 0 0; }
    .lead { margin-bottom: 6pt; }
    .card, .chart-box, .step, .doc, .flow-note, .qlist li { box-shadow: none; padding: 7pt 9pt; break-inside: avoid; }
    .grid.three { grid-template-columns: repeat(3, 1fr); gap: 7pt; }
    .flow { grid-template-columns: 1fr auto 1fr auto 1fr auto 1.6fr auto 1fr; }
    .arrow { display: flex; align-items: center; padding: 0 2pt; }
    .arrow::before { content: "→"; }
    .canvas-wrap { height: auto; }
    #chartCanvas { display: none !important; }
    #chartImg { display: block; max-height: 62mm; width: auto; margin: 0 auto; }
    .tag { font-size: 8pt; padding: 2pt 5pt; }
    a[data-print-url]::after { content: " (" attr(href) ")"; font-size: 8.5pt; color: var(--ink-2); }
    .orig { font-size: 10pt; }
  }
  /* While preparing to print, lay out every panel so the chart can be measured */
  body.printing .panel[hidden] { display: block !important; }
</style>

// Section order. The id is the link (#rules, #chart …); heading is read from CONTENT.
const SECTIONS = [
  { id: "rules",    panel: "p-rules",        heading: "rules.heading" },
  { id: "chart",    panel: "p-chart", heading: "chart.heading" },
  { id: "impact",   panel: "p-impact",       heading: "inferences.heading" },
  { id: "workflow", panel: "p-workflow",     heading: "workflow.heading" },
  { id: "unclear",  panel: "p-unclear",      heading: "unclear.heading" },
  { id: "method",   panel: "p-method",       heading: "method.heading" },
  { id: "about",    panel: "p-about",        heading: "about.heading" }
];

const PH_RE = /(\[[A-Z0-9_ -]+\])/;
const isPlaceholder = s => /^\[[A-Z0-9_ -]+\]$/.test(s);

// Write text into an element, wrapping [PLACEHOLDERS] in a visible <mark>.
function setText(el, str) {
  el.textContent = "";
  String(str).split(PH_RE).forEach(part => {
    if (!part) return;
    if (isPlaceholder(part)) {
      const m = document.createElement("mark");
      m.className = "ph"; m.textContent = part;
      el.appendChild(m);
    } else {
      el.appendChild(document.createTextNode(part));
    }
  });
}
const get = (obj, path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
const fill = (tpl, vars) => tpl.replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : `{${k}}`));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) setText(e, text); return e; };
const pad = i => String(i + 1).padStart(2, "0");
const tag = (kind, T) => el("span", "tag " + kind, T.labels[kind]);

function linkOrPlaceholder(container, url) {
  container.textContent = "";
  if (isPlaceholder(url)) { setText(container, url); return; }
  const a = document.createElement("a");
  a.href = url; a.textContent = url.replace(/^https?:\/\//, "");
  a.rel = "noopener"; a.target = "_blank"; a.setAttribute("data-print-url", "");
  container.appendChild(a);
}

// ---- Pricing rule (from Annex 1, item 175) ----
const rate = n => (n === 1 ? 1.0 : n <= 5 ? 0.8 : n <= 10 ? 0.7 : 0.6);
const billed = n => Math.round(n * rate(n) * 10) / 10;  // avoids 6.6000000000000005
const N = Array.from({ length: 30 }, (_, i) => i + 1);

let lang = "en", chart = null, current = null;   // current: section index, or null = overview

// Small inline sparkline for the chart tile (computed from the same rule).
function sparkline() {
  const W = 300, H = 86, P = 6, max = billed(30);
  const x = n => P + (n - 1) / 29 * (W - 2 * P);
  const y = v => H - P - v / max * (H - 2 * P);
  const pts = N.map(n => `${x(n).toFixed(1)},${y(billed(n)).toFixed(1)}`).join(" ");
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(ns, "svg");
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("class", "spark"); svg.setAttribute("aria-hidden", "true");
  svg.innerHTML =
    `<rect x="${x(10) - 5}" y="0" width="${x(11) - x(10) + 10}" height="${H}" fill="rgba(138,90,0,.12)"/>` +
    `<polyline points="${pts}" fill="none" stroke="#1f4e79" stroke-width="2"/>` +
    `<line x1="${x(10)}" y1="${y(7)}" x2="${x(11)}" y2="${y(6.6)}" stroke="#8a5a00" stroke-width="4" stroke-linecap="round"/>` +
    `<circle cx="${x(10)}" cy="${y(7)}" r="4" fill="#8a5a00"/><circle cx="${x(11)}" cy="${y(6.6)}" r="4" fill="#8a5a00"/>`;
  return svg;
}

function render() {
  const T = CONTENT[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";

  document.querySelectorAll("[data-t]").forEach(e => setText(e, get(T, e.dataset.t) ?? ""));
  document.querySelectorAll("[data-orig]").forEach(e => setText(e, ORIGINAL[e.dataset.orig]));
  document.getElementById("langGroup").setAttribute("aria-label", T.ui.langGroup);
  document.getElementById("tabs").setAttribute("aria-label", T.nav.sectionsAria);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

  // Overview tiles
  const tiles = document.getElementById("tiles"); tiles.textContent = "";
  SECTIONS.forEach((s, i) => {
    const d = T.home.tiles[i];
    const layout = { chart: " featured", rules: " wide-m", about: " wide-m wide-d" }[s.id] || "";
    const a = el("a", "tile" + layout);
    a.href = "#" + s.id;
    const go = el("span", "t-go", "→"); go.setAttribute("aria-hidden", "true"); a.appendChild(go);
    a.appendChild(el("span", "t-num", pad(i)));
    a.appendChild(el("span", "t-title", get(T, s.heading)));
    const body = el("div", "t-body");
    const txt = el("div");
    if (d.stat) txt.appendChild(el("div", "t-stat", d.stat));
    txt.appendChild(el("div", "t-teaser", d.teaser));
    body.appendChild(txt);
    if (s.id === "chart") body.appendChild(sparkline());
    a.appendChild(body);
    if (d.tags.length) { const tg = el("div", "t-tags"); d.tags.forEach(k => tg.appendChild(tag(k, T))); a.appendChild(tg); }
    tiles.appendChild(a);
  });

  // Section tabs
  const tabs = document.getElementById("tabs"); tabs.textContent = "";
  SECTIONS.forEach((s, i) => {
    const a = el("a"); a.href = "#" + s.id; a.dataset.idx = i;
    a.appendChild(el("span", "n", pad(i))); a.appendChild(document.createTextNode(T.home.tiles[i].short));
    tabs.appendChild(a);
  });

  // Fact cards
  const fc = document.getElementById("factCards"); fc.textContent = "";
  T.rules.cards.forEach(c => {
    const card = el("article", "card");
    card.appendChild(tag("fact", T));
    card.appendChild(el("h3", null, c.title));
    card.appendChild(el("div", "field", T.rules.fieldPlain));
    card.appendChild(el("p", null, c.body));
    card.appendChild(el("div", "field", T.rules.fieldOrig));
    const q = el("blockquote", "orig"); q.lang = "zh-CN";
    ORIGINAL[c.orig].forEach(line => q.appendChild(el("p", null, line)));
    card.appendChild(q);
    if (c.translation) {
      card.appendChild(el("div", "field", T.rules.fieldTranslation));
      card.appendChild(el("p", "translation", c.translation));
    }
    card.appendChild(el("div", "field", T.rules.fieldSource));
    card.appendChild(el("p", "src", c.source));
    fc.appendChild(card);
  });

  // Inference cards
  const ic = document.getElementById("infCards"); ic.textContent = "";
  T.inferences.cards.forEach(c => {
    const card = el("article", "card");
    card.appendChild(tag("inference", T));
    card.appendChild(el("h3", null, c.title));
    card.appendChild(el("p", null, c.body));
    ic.appendChild(card);
  });

  // Workflow
  const fl = document.getElementById("flow"); fl.textContent = "";
  T.workflow.steps.forEach((s, i) => {
    if (i > 0) { const a = el("li", "arrow"); a.setAttribute("aria-hidden", "true"); fl.appendChild(a); }
    const li = el("li", "step is-" + s.status);
    li.appendChild(el("h3", null, s.name));
    li.appendChild(tag(s.status, T));
    const ul = el("ul");
    s.items.forEach(it => {
      const item = el("li");
      const m = it.match(/^(\d+)( · .*)$/);
      if (m) { item.appendChild(el("span", "num", m[1])); item.appendChild(document.createTextNode(m[2])); }
      else setText(item, it);
      ul.appendChild(item);
    });
    li.appendChild(ul);
    fl.appendChild(li);
  });

  // Unclear
  const ul = document.getElementById("unclearList"); ul.textContent = "";
  T.unclear.items.forEach(t => {
    const li = el("li");
    const q = el("span", "q", "?"); q.setAttribute("aria-hidden", "true");
    li.appendChild(q); li.appendChild(el("span", null, t));
    ul.appendChild(li);
  });

  setText(document.querySelector('[data-t="chart.note14"]'), fill(T.chart.note14, { reg: ORIGINAL.nmpaReg }));
  linkOrPlaceholder(document.getElementById("liLink"), LINKS.linkedin);

  document.getElementById("chartCanvas").setAttribute("aria-label", T.ui.chartAria);
  document.getElementById("chartImg").alt = T.ui.chartImgAlt;
  document.getElementById("nSlider").setAttribute("aria-label", T.chart.sliderLabel);

  updateLive();
  showView(false);
}

// ---- Views: overview ↔ one section at a time (driven by the URL hash) ----
function indexFromHash() {
  const id = decodeURIComponent(location.hash.replace(/^#/, ""));
  const i = SECTIONS.findIndex(s => s.id === id);
  return i < 0 ? null : i;
}

function showView(moveFocus) {
  const T = CONTENT[lang];
  current = indexFromHash();
  const home = current === null;
  document.body.classList.toggle("mode-home", home);
  document.body.classList.toggle("mode-section", !home);
  document.getElementById("home").hidden = !home;
  document.getElementById("hero").hidden = !home;
  document.getElementById("backLink").hidden = home;
  document.getElementById("miniTitle").hidden = !home ? false : true;
  document.getElementById("tabs").hidden = home;
  document.getElementById("pager").hidden = home;
  document.getElementById("swipeHint").hidden = home;
  SECTIONS.forEach((s, i) => { document.getElementById(s.panel).hidden = i !== current; });

  document.title = home ? T.header.title : `${get(T, SECTIONS[current].heading)} · ${T.nav.siteShort}`;

  if (!home) {
    // tabs
    document.querySelectorAll("#tabs a").forEach(a => {
      const on = +a.dataset.idx === current;
      if (on) { a.setAttribute("aria-current", "page"); } else { a.removeAttribute("aria-current"); }
    });
    const activeTab = document.querySelector('#tabs a[aria-current="page"]');
    if (activeTab) activeTab.scrollIntoView({ block: "nearest", inline: "center" });
    // pager
    const pager = document.getElementById("pager"); pager.textContent = "";
    const mk = (i, cls, dir) => {
      const a = el("a", cls); a.href = "#" + SECTIONS[i].id;
      a.appendChild(el("span", "dir", dir)); a.appendChild(el("span", "nm", pad(i) + " · " + T.home.tiles[i].short));
      pager.appendChild(a);
    };
    if (current > 0) mk(current - 1, "prev", "← " + T.nav.previous);
    if (current < SECTIONS.length - 1) mk(current + 1, "next", T.nav.next + " →");
    // chart needs to be (re)built once its panel is visible
    if (SECTIONS[current].id === "chart") drawChart();
  }

  if (moveFocus) {
    window.scrollTo(0, 0);
    if (home) document.getElementById("tiles").querySelector("a")?.focus({ preventScroll: true });
    else document.querySelector("#" + SECTIONS[current].panel + " h2")?.focus({ preventScroll: true });
  }
}

function go(delta) {
  if (current === null) return;
  const i = current + delta;
  if (i >= 0 && i < SECTIONS.length) location.hash = SECTIONS[i].id;
}

window.addEventListener("hashchange", () => showView(true));
document.addEventListener("keydown", e => {
  if (current === null || (e.target.closest && e.target.closest("input, textarea"))) return;
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === "Escape") location.hash = "";
});

// Swipe left/right inside a section (ignored on the slider and the chart).
let touch = null;
document.getElementById("main").addEventListener("touchstart", e => {
  if (current === null || e.target.closest("input, canvas")) { touch = null; return; }
  touch = { x: e.touches[0].clientX, y: e.touches[0].clientY };
}, { passive: true });
document.getElementById("main").addEventListener("touchend", e => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
  touch = null;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.8) go(dx < 0 ? 1 : -1);
}, { passive: true });

// ---- Chart ----
function updateLive() {
  const T = CONTENT[lang];
  const n = +document.getElementById("nSlider").value;
  const x = billed(n).toFixed(1), y = Math.round(rate(n) * 100);
  const out = document.getElementById("liveText");
  out.textContent = fill(n === 1 ? T.chart.liveOne : T.chart.liveMany, { n, x, y });
  out.classList.toggle("down", n > 1 && billed(n) < billed(n - 1));
  if (chart) { chart.$selected = n; chart.update("none"); }
}

// Small inline plugin: draws the 10→11 drop and the n=14 example on the canvas.
const markers = {
  id: "markers",
  afterDatasetsDraw(c) {
    const css = getComputedStyle(document.documentElement);
    const accent = css.getPropertyValue("--accent").trim();
    const inf = css.getPropertyValue("--inf").trim();
    const meta = c.getDatasetMeta(0), ctx = c.ctx;
    const p10 = meta.data[9], p11 = meta.data[10], p14 = meta.data[13];
    ctx.save();
    ctx.fillStyle = "rgba(138,90,0,.10)";
    const bx = p10.x - 6, bw = (p11.x - p10.x) + 12;
    ctx.fillRect(bx, c.chartArea.top, bw, c.chartArea.bottom - c.chartArea.top);
    ctx.strokeStyle = inf; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(p10.x, p10.y); ctx.lineTo(p11.x, p11.y); ctx.stroke();
    [p10, p11].forEach(p => { ctx.fillStyle = inf; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill(); });
    ctx.font = "600 12px " + css.getPropertyValue("--sans");
    ctx.fillStyle = inf; ctx.textAlign = "left";
    ctx.fillText("10 → 11: 7.0 → 6.6", bx + bw + 6, c.chartArea.top + 12);
    ctx.strokeStyle = accent; ctx.lineWidth = 3; ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(p14.x, p14.y, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = accent; ctx.textAlign = "left";
    ctx.fillText("n = 14 → 8.4", p14.x + 4, p14.y + 22);
    const n = c.$selected;
    if (n) {
      const p = meta.data[n - 1];
      ctx.strokeStyle = "rgba(28,33,38,.25)"; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(p.x, c.chartArea.top); ctx.lineTo(p.x, c.chartArea.bottom); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = "#1c2126";
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
};

function drawChart() {
  if (typeof Chart === "undefined") return;  // CDN unavailable: page still readable
  const T = CONTENT[lang];
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue("--accent").trim();
  const ink2 = css.getPropertyValue("--ink-2").trim();
  const line = css.getPropertyValue("--line").trim();
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chartCanvas"), {
    type: "line",
    data: { labels: N, datasets: [{
      label: T.chart.series, data: N.map(billed),
      borderColor: accent, backgroundColor: accent, borderWidth: 2,
      pointRadius: 2.5, pointHoverRadius: 6, tension: 0
    }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { top: 18, right: 8 } },
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { displayColors: false, callbacks: {
          title: () => "",
          label: i => fill(T.chart.tooltip, { n: i.parsed.x + 1, x: billed(i.parsed.x + 1).toFixed(1), y: Math.round(rate(i.parsed.x + 1) * 100) })
        } }
      },
      scales: {
        x: { title: { display: true, text: T.chart.axisX, color: ink2 }, grid: { display: false },
             ticks: { color: ink2, autoSkip: false, maxRotation: 0, callback: (v, i) => ([0, 4, 9, 14, 19, 24, 29].includes(i) ? N[i] : "") } },
        y: { beginAtZero: true, title: { display: true, text: T.chart.axisY, color: ink2 },
             grid: { color: line }, ticks: { color: ink2, stepSize: 2 } }
      }
    },
    plugins: [markers]
  });
  chart.$selected = +document.getElementById("nSlider").value;
  chart.update("none");
}

// Print: show every section and swap the canvas for a static image.
window.addEventListener("beforeprint", () => {
  document.body.classList.add("printing");
  document.getElementById("hero").hidden = false;
  drawChart();
  if (chart) document.getElementById("chartImg").src = chart.toBase64Image("image/png", 1);
});
window.addEventListener("afterprint", () => {
  document.body.classList.remove("printing");
  showView(false);
});

// ---- Language: ?lang= in URL > saved choice > English ----
function initialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && CONTENT[q]) return q;
  try { const s = localStorage.getItem("lang"); if (s && CONTENT[s]) return s; } catch (e) {}
  return "en";
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  try {
    const u = new URL(location.href);   // keeps the #section part
    if (l === "en") u.searchParams.delete("lang"); else u.searchParams.set("lang", l);
    history.replaceState(null, "", u);
  } catch (e) {}
  render();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
document.getElementById("nSlider").addEventListener("input", updateLive);

lang = initialLang();
render();
</script>
</body>
</html>
