  .caption { font-size: 14px; color: var(--ink-2); margin: 12px 0 0; }

  .arrow { text-align: center; color: var(--ink-2); font-size: 20px; line-height: 1; padding: 6px 0; }

    a[data-print-url]::after { content: " (" attr(href) ")"; font-size: 8.5pt; color: var(--ink-2); }

/* ======================= Layout code below ========================== */

const PH_RE = /(\[[A-Z0-9_ -]+\])/;
const isPlaceholder = s => /^\[[A-Z0-9_ -]+\]$/.test(s);

// Write text into an element, wrapping [PLACEHOLDERS] in a visible <mark>.
function setText(el, str) {
  el.textContent = "";
  String(str).split(PH_RE).forEach(part => {
    if (!part) return;
    if (isPlaceholder(part)) {
      const m = document.createElement("mark");
      m.className = "ph"; m.textContent = part;
      el.appendChild(m);
    } else {
      el.appendChild(document.createTextNode(part));
    }
  });
}
const get = (obj, path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
const fill = (tpl, vars) => tpl.replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : `{${k}}`));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) setText(e, text); return e; };

function tag(kind, T) {
  const t = el("span", "tag " + kind, T.labels[kind]);
  return t;
}

function linkOrPlaceholder(container, url) {
  container.textContent = "";
  if (isPlaceholder(url)) { setText(container, url); return; }
  const a = document.createElement("a");
  a.href = url; a.textContent = url.replace(/^https?:\/\//, "");
  a.rel = "noopener"; a.target = "_blank"; a.setAttribute("data-print-url", "");
  container.appendChild(a);
}

// ---- Pricing rule (from Annex 1, item 175) ----
const rate = n => (n === 1 ? 1.0 : n <= 5 ? 0.8 : n <= 10 ? 0.7 : 0.6);
const billed = n => Math.round(n * rate(n) * 10) / 10;  // avoids 6.6000000000000005
const N = Array.from({ length: 30 }, (_, i) => i + 1);

let lang = "en", chart = null;

function render() {
  const T = CONTENT[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = T.header.title;

  document.querySelectorAll("[data-t]").forEach(e => setText(e, get(T, e.dataset.t) ?? ""));
  document.querySelectorAll("[data-orig]").forEach(e => setText(e, ORIGINAL[e.dataset.orig]));
  document.getElementById("langGroup").setAttribute("aria-label", T.ui.langGroup);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));

  // Fact cards
  const fc = document.getElementById("factCards"); fc.textContent = "";
  T.rules.cards.forEach(c => {
    const card = el("article", "card");
    card.appendChild(tag("fact", T));
    card.appendChild(el("h3", null, c.title));
    card.appendChild(el("div", "field", T.rules.fieldPlain));
    card.appendChild(el("p", null, c.body));
    card.appendChild(el("div", "field", T.rules.fieldOrig));
    const q = el("blockquote", "orig"); q.lang = "zh-CN";
    ORIGINAL[c.orig].forEach(line => q.appendChild(el("p", null, line)));
    card.appendChild(q);
    card.appendChild(el("div", "field", T.rules.fieldSource));
    card.appendChild(el("p", "src", c.source));
    fc.appendChild(card);
  });

  // Inference cards
  const ic = document.getElementById("infCards"); ic.textContent = "";
  T.inferences.cards.forEach(c => {
    const card = el("article", "card");
    card.appendChild(tag("inference", T));
    card.appendChild(el("h3", null, c.title));
    card.appendChild(el("p", null, c.body));
    ic.appendChild(card);
  });

  // Workflow
  const fl = document.getElementById("flow"); fl.textContent = "";
  T.workflow.steps.forEach((s, i) => {
    if (i > 0) { const a = el("li", "arrow"); a.setAttribute("aria-hidden", "true"); fl.appendChild(a); }
    const li = el("li", "step is-" + s.status);
    li.appendChild(el("h3", null, s.name));
    li.appendChild(tag(s.status, T));
    const ul = el("ul");
    s.items.forEach(it => {
      const item = el("li");
      const m = it.match(/^(\d+)( · .*)$/);
      if (m) { item.appendChild(el("span", "num", m[1])); item.appendChild(document.createTextNode(m[2])); }
      else setText(item, it);
      ul.appendChild(item);
    });
    li.appendChild(ul);
    fl.appendChild(li);
  });

  // Unclear
  const ul = document.getElementById("unclearList"); ul.textContent = "";
  T.unclear.items.forEach(t => {
    const li = el("li");
    const q = el("span", "q", "?"); q.setAttribute("aria-hidden", "true");
    li.appendChild(q); li.appendChild(el("span", null, t));
    ul.appendChild(li);
  });

  // Chart note with registration number
  setText(document.querySelector('[data-t="chart.note14"]'), fill(T.chart.note14, { reg: ORIGINAL.nmpaReg }));

  linkOrPlaceholder(document.getElementById("dashLink"), LINKS.dashboard);
  linkOrPlaceholder(document.getElementById("liLink"), LINKS.linkedin);

  document.getElementById("chart").setAttribute("aria-label", T.ui.chartAria);
  document.getElementById("chartImg").alt = T.ui.chartImgAlt;
  document.getElementById("nSlider").setAttribute("aria-label", T.chart.sliderLabel);

  updateLive();
  drawChart();
}

function updateLive() {
  const T = CONTENT[lang];
  const n = +document.getElementById("nSlider").value;
  const x = billed(n).toFixed(1), y = Math.round(rate(n) * 100);
  const out = document.getElementById("liveText");
  out.textContent = fill(n === 1 ? T.chart.liveOne : T.chart.liveMany, { n, x, y });
  out.classList.toggle("down", n > 1 && billed(n) < billed(n - 1));
  if (chart) { chart.$selected = n; chart.update("none"); }
}

// Small inline plugin: draws the 10→11 drop and the n=14 example on the canvas.
const markers = {
  id: "markers",
  afterDatasetsDraw(c) {
    const css = getComputedStyle(document.documentElement);
    const accent = css.getPropertyValue("--accent").trim();
    const inf = css.getPropertyValue("--inf").trim();
    const meta = c.getDatasetMeta(0), ctx = c.ctx;
    const p10 = meta.data[9], p11 = meta.data[10], p14 = meta.data[13];
    ctx.save();
    // shaded band around the 10 → 11 drop
    ctx.fillStyle = "rgba(138,90,0,.10)";
    const bx = p10.x - 6, bw = (p11.x - p10.x) + 12;
    ctx.fillRect(bx, c.chartArea.top, bw, c.chartArea.bottom - c.chartArea.top);
    // drop segment
    ctx.strokeStyle = inf; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(p10.x, p10.y); ctx.lineTo(p11.x, p11.y); ctx.stroke();
    [p10, p11].forEach(p => { ctx.fillStyle = inf; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill(); });
    ctx.font = "600 12px " + css.getPropertyValue("--sans");
    ctx.fillStyle = inf; ctx.textAlign = "left";
    ctx.fillText("10 → 11: 7.0 → 6.6", bx + bw + 6, c.chartArea.top + 12);
    // n = 14 example
    ctx.strokeStyle = accent; ctx.lineWidth = 3; ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(p14.x, p14.y, 7, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = accent; ctx.textAlign = "left";
    ctx.fillText("n = 14 → 8.4", p14.x + 4, p14.y + 22);
    // slider position
    const n = c.$selected;
    if (n) {
      const p = meta.data[n - 1];
      ctx.strokeStyle = "rgba(28,33,38,.25)"; ctx.lineWidth = 1; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(p.x, c.chartArea.top); ctx.lineTo(p.x, c.chartArea.bottom); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle = "#1c2126";
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
};

function drawChart() {
  if (typeof Chart === "undefined") return;  // CDN unavailable: page still readable
  const T = CONTENT[lang];
  const css = getComputedStyle(document.documentElement);
  const accent = css.getPropertyValue("--accent").trim();
  const ink2 = css.getPropertyValue("--ink-2").trim();
  const line = css.getPropertyValue("--line").trim();
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "line",
    data: { labels: N, datasets: [{
      label: T.chart.series, data: N.map(billed),
      borderColor: accent, backgroundColor: accent, borderWidth: 2,
      pointRadius: 2.5, pointHoverRadius: 6, tension: 0
    }] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      layout: { padding: { top: 18, right: 8 } },
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: { displayColors: false, callbacks: {
          title: () => "",
          label: i => fill(T.chart.tooltip, { n: i.parsed.x + 1, x: billed(i.parsed.x + 1).toFixed(1), y: Math.round(rate(i.parsed.x + 1) * 100) })
        } }
      },
      scales: {
        x: { title: { display: true, text: T.chart.axisX, color: ink2 }, grid: { display: false },
             ticks: { color: ink2, autoSkip: false, maxRotation: 0, callback: (v, i) => ([0, 4, 9, 14, 19, 24, 29].includes(i) ? N[i] : "") } },
        y: { beginAtZero: true, title: { display: true, text: T.chart.axisY, color: ink2 },
             grid: { color: line }, ticks: { color: ink2, stepSize: 2 } }
      }
    },
    plugins: [markers]
  });
  chart.$selected = +document.getElementById("nSlider").value;
  chart.update("none");
}

// Print: swap the canvas for a static image so it prints crisply.
window.addEventListener("beforeprint", () => {
  if (!chart) return;
  const img = document.getElementById("chartImg");
  img.src = chart.toBase64Image("image/png", 1);
});

// ---- Language: ?lang= in URL > saved choice > English ----
function initialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && CONTENT[q]) return q;
  try { const s = localStorage.getItem("lang"); if (s && CONTENT[s]) return s; } catch (e) {}
  return "en";
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  try {
    const u = new URL(location.href);
    if (l === "en") u.searchParams.delete("lang"); else u.searchParams.set("lang", l);
    history.replaceState(null, "", u);
  } catch (e) {}
  render();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
document.getElementById("nSlider").addEventListener("input", updateLive);

lang = initialLang();
render();
</script>
