/* ======================= Layout code below ========================== */

const get = (obj, path) => path.split(".").reduce((o, k) => (o == null ? o : o[k]), obj);
const fill = (tpl, vars) => tpl.replace(/\{(\w+)\}/g, (_, k) => (k in vars ? vars[k] : `{${k}}`));
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

// 亿元 → "RMB 17.65bn" / "RMB 384m" (en) or "176.50亿元" (zh)
function money(v, lang) {
  if (lang === "zh") return v.toFixed(2) + "亿元";
  return v >= 10 ? "RMB " + (v / 10).toFixed(2) + "bn" : "RMB " + Math.round(v * 100) + "m";
}
const pct = g => (g > 0 ? "+" : g < 0 ? "−" : "") + Math.abs(g).toFixed(1) + "%";
const share = c => Math.round(c.overseas.revenue / c.total * 100) + "%";
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function srcLink(s) {
  const a = el("a", null, s.label);
  a.href = s.url; a.rel = "noopener"; a.target = "_blank"; a.setAttribute("data-print-url", "");
  return a;
}

let lang = "en";

function renderChart(T) {
  const series = [
    { key: "domestic", label: T.chart.domestic, color: cssVar("--s-domestic") },
    { key: "overseas", label: T.chart.overseas, color: cssVar("--s-overseas") }
  ];
  // legend
  const lg = document.getElementById("legend"); lg.textContent = "";
  series.forEach(s => {
    const li = el("li"); const sw = el("span", "sw"); sw.style.background = s.color; sw.setAttribute("aria-hidden", "true");
    li.appendChild(sw); li.appendChild(document.createTextNode(s.label)); lg.appendChild(li);
  });

  // one shared axis: growth %, padded so value labels fit
  const all = DATA.companies.flatMap(c => [c.domestic.growth, c.overseas.growth]);
  const lo = Math.min(-10, Math.floor(Math.min(...all) / 10) * 10 - 10);
  const hi = Math.max(10, Math.ceil(Math.max(...all) / 10) * 10 + 10);
  const pos = v => (v - lo) / (hi - lo) * 100;
  const ticks = []; for (let t = Math.ceil(lo / 20) * 20; t <= hi; t += 20) ticks.push(t);
  const line = cssVar("--line"), ink2 = cssVar("--ink-2");
  const gridBg = ticks.map(t => {
    const p = pos(t), c = t === 0 ? ink2 : line, w = t === 0 ? 1 : 0.5;
    return `linear-gradient(to right, transparent calc(${p}% - ${w}px), ${c} calc(${p}% - ${w}px), ${c} calc(${p}% + ${w}px), transparent calc(${p}% + ${w}px))`;
  }).join(",");

  const rows = document.getElementById("chartRows"); rows.textContent = "";
  DATA.companies.forEach(c => {
    const row = el("div", "crow");
    const nm = el("div", "cname", c.name[lang]); nm.appendChild(el("small", null, c.ticker));
    row.appendChild(nm);
    const bars = el("div", "bars"); bars.style.backgroundImage = gridBg;
    series.forEach(s => {
      const g = c[s.key].growth;
      const tr = el("div", "track"); tr.tabIndex = 0;
      const tipText = fill(T.chart.tooltip, { company: c.name[lang], series: s.label, money: money(c[s.key].revenue, lang), pct: pct(g) });
      tr.setAttribute("aria-label", tipText); tr.dataset.tip = tipText;
      const b = el("div", "bar " + (g >= 0 ? "pos" : "neg")); b.style.background = s.color;
      const a = pos(Math.min(0, g)), z = pos(Math.max(0, g));
      b.style.left = a + "%"; b.style.width = Math.max(z - a, 0.4) + "%";
      tr.appendChild(b);
      const v = el("span", "val", pct(g));
      if (g >= 0) v.style.left = `calc(${z}% + 6px)`; else v.style.right = `calc(${100 - a}% + 6px)`;
      tr.appendChild(v);
      bars.appendChild(tr);
    });
    row.appendChild(bars);
    rows.appendChild(row);
  });
  // axis
  const ax = el("div", "crow");
  ax.appendChild(el("div", "spacer"));
  const axis = el("div", "axis");
  ticks.forEach(t => { const s = el("span", null, (t > 0 ? "+" : t < 0 ? "−" : "") + Math.abs(t) + "%"); s.style.left = pos(t) + "%";
    if (pos(t) < 6) s.style.transform = "none"; else if (pos(t) > 94) s.style.transform = "translateX(-100%)";  // keep edge labels inside
    axis.appendChild(s); });
  const axWrap = el("div"); axWrap.appendChild(axis); axWrap.appendChild(el("p", "axis-title", T.chart.axis));
  ax.appendChild(axWrap); ax.style.marginBottom = "0";
  rows.appendChild(ax);

  // table view
  const tb = document.getElementById("dataTable"); tb.textContent = "";
  const hr = el("tr"); T.chart.th.forEach(h => hr.appendChild(el("th", null, h)));
  const thead = el("thead"); thead.appendChild(hr); tb.appendChild(thead);
  const tbody = el("tbody");
  DATA.companies.forEach(c => {
    const tr = el("tr");
    [c.name[lang], money(c.domestic.revenue, lang), pct(c.domestic.growth), money(c.overseas.revenue, lang), pct(c.overseas.growth), share(c)]
      .forEach(x => tr.appendChild(el("td", null, x)));
    tbody.appendChild(tr);
  });
  tb.appendChild(tbody);
}

// Tooltip: follows the pointer over a bar row; also shows on keyboard focus.
const tip = document.getElementById("tip"), box = document.getElementById("chartBox");
function showTip(tr, x, y) {
  tip.textContent = tr.dataset.tip; tip.hidden = false;
  const bw = box.clientWidth, tw = tip.offsetWidth;
  tip.style.left = Math.min(Math.max(x + 12, 8), bw - tw - 8) + "px";
  tip.style.top = (y - tip.offsetHeight - 10) + "px";
}
box.addEventListener("pointermove", e => {
  const tr = e.target.closest(".track");
  if (!tr) { tip.hidden = true; return; }
  const r = box.getBoundingClientRect();
  showTip(tr, e.clientX - r.left, e.clientY - r.top);
});
box.addEventListener("pointerleave", () => { tip.hidden = true; });
box.addEventListener("focusin", e => {
  const tr = e.target.closest(".track"); if (!tr) return;
  const r = box.getBoundingClientRect(), t = tr.getBoundingClientRect();
  showTip(tr, t.left - r.left + t.width / 2 - 60, t.top - r.top);
});
box.addEventListener("focusout", () => { tip.hidden = true; });

function render() {
  const T = CONTENT[lang];
  document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
  document.title = T.header.title;
  document.querySelectorAll("[data-t]").forEach(e => { e.textContent = get(T, e.dataset.t) ?? ""; });
  document.getElementById("langGroup").setAttribute("aria-label", T.ui.langGroup);
  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  const q = lang === "zh" ? "?lang=zh" : "";
  document.getElementById("backLink").href = "index.html" + q;
  document.getElementById("briefLink").href = "index.html" + q;
  document.getElementById("chartHeading").textContent = fill(T.chart.heading, { year: DATA.fiscalYear });
  document.getElementById("coLead").textContent = fill(T.companies.lead, { year: DATA.fiscalYear });
  document.getElementById("footerText").textContent = fill(T.footer, { asOf: DATA.asOf[lang] });

  // 01 drivers
  const dr = document.getElementById("drivers"); dr.textContent = "";
  DATA.drivers.forEach(d => {
    const li = el("li");
    li.appendChild(el("span", "tag " + d.kind, T.labels[d.kind]));
    li.appendChild(el("p", null, d[lang]));
    if (d.source) { const s = el("p", "src"); s.appendChild(srcLink(d.source)); li.appendChild(s); }
    dr.appendChild(li);
  });

  // 02 chart
  renderChart(T);

  // 03 cards
  const cards = document.getElementById("cards"); cards.textContent = "";
  DATA.companies.forEach(c => {
    const card = el("article", "card");
    card.appendChild(el("span", "tag fact", T.labels.fact));
    card.appendChild(el("h3", null, c.name[lang]));
    card.appendChild(el("p", "ticker", c.ticker));
    const st = el("div", "stats");
    [[T.companies.kOverseas, money(c.overseas.revenue, lang)], [T.companies.kGrowth, pct(c.overseas.growth)], [T.companies.kShare, share(c)]]
      .forEach(([k, v]) => { const d = el("div"); d.appendChild(el("span", "k", k)); d.appendChild(el("span", "v", v)); st.appendChild(d); });
    card.appendChild(st);
    card.appendChild(el("div", "field", T.companies.signals));
    const ul = el("ul"); c.signals[lang].forEach(s => ul.appendChild(el("li", null, s))); card.appendChild(ul);
    if (c.caveat && c.caveat[lang]) { card.appendChild(el("div", "field", T.companies.note)); card.appendChild(el("p", "note", c.caveat[lang])); }
    card.appendChild(el("div", "field", T.companies.sources));
    const sl = el("ul", "srcs"); c.sources.forEach(s => { const li = el("li"); li.appendChild(srcLink(s)); sl.appendChild(li); }); card.appendChild(sl);
    cards.appendChild(card);
  });

  // 04 tracking list
  const tl = document.getElementById("trackList"); tl.textContent = "";
  T.track.items.forEach(([t, d]) => { const li = el("li"); li.appendChild(el("strong", null, t)); li.appendChild(el("span", null, d)); tl.appendChild(li); });

  // 05 method
  const ml = document.getElementById("methodList"); ml.textContent = "";
  T.method.items.forEach(m => ml.appendChild(el("li", null, m)));
}

// Language: ?lang= in URL > saved choice (shared with index.html) > English
function initialLang() {
  const q = new URLSearchParams(location.search).get("lang");
  if (q && CONTENT[q]) return q;
  try { const s = localStorage.getItem("lang"); if (s && CONTENT[s]) return s; } catch (e) {}
  return "en";
}
function setLang(l) {
  lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
  try {
    const u = new URL(location.href);
    if (l === "en") u.searchParams.delete("lang"); else u.searchParams.set("lang", l);
    history.replaceState(null, "", u);
  } catch (e) {}
  render();
}
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => setLang(b.dataset.lang)));
lang = initialLang();
render();
</script>
